<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Balloon Pop Carnival — KYRAXO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: linear-gradient(135deg, #fbcfe8 0%, #fde047 100%); display: flex; flex-direction: column; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  header { height: 50px; background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 2px solid rgba(0,0,0,0.08); z-index: 10; }
  .title { font-size: 16px; font-weight: 800; color: #e11d48; }
  .btn { background: #fff; border: 2px solid #e11d48; border-radius: 10px; padding: 5px 12px; font-size: 13px; font-weight: 700; cursor: pointer; color: #e11d48; }
  #game-wrap { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 8px; }
  canvas { background: #ffffff; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); max-width: 100%; max-height: 100%; touch-action: none; }
</style>
</head>
<body>
<header>
  <div class="title">Balloon Pop Carnival</div>
  <button class="btn" onclick="if(window.resetGame)resetGame()">Reset</button>
</header>
<div id="game-wrap">
  <canvas id="c"></canvas>
</div>
<script>
function playSfx(freq = 440, type = 'sine', dur = 0.1, vol = 0.2) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, ac.currentTime);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch(e) {}
}
function playArp(notes, dur = 0.08) {
  notes.forEach((f, i) => setTimeout(() => playSfx(f, 'triangle', 0.2, 0.25), i * dur * 1000));
}
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 800; canvas.height = 500;
function saveCanvas() {
  playSfx(660);
  const a = document.createElement('a');
  a.download = 'balloon-pop-carnival.png';
  a.href = canvas.toDataURL();
  a.click();
}

      let balloons = [];
      let score = 0;
      function resetGame() { balloons = []; score = 0; }
      setInterval(() => {
        const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];
        balloons.push({ x: 60 + Math.random() * 680, y: 520, col: colors[Math.floor(Math.random() * colors.length)], vy: 2 + Math.random() * 2 });
      }, 600);
      canvas.addEventListener('pointerdown', e => {
        const r = canvas.getBoundingClientRect();
        const x = (e.clientX - r.left) * (canvas.width / r.width);
        const y = (e.clientY - r.top) * (canvas.height / r.height);
        for (let i = balloons.length - 1; i >= 0; i--) {
          const b = balloons[i];
          if (Math.hypot(x - b.x, y - b.y) < 35) {
            playSfx(800, 'triangle', 0.1);
            balloons.splice(i, 1);
            score++;
            break;
          }
        }
      });
      function loop() {
        ctx.fillStyle = '#fff7ed'; ctx.fillRect(0, 0, 800, 500);
        for (let i = balloons.length - 1; i >= 0; i--) {
          const b = balloons[i];
          b.y -= b.vy;
          ctx.fillStyle = b.col; ctx.beginPath(); ctx.ellipse(b.x, b.y, 28, 38, 0, 0, Math.PI * 2); ctx.fill();
          if (b.y < -50) balloons.splice(i, 1);
        }
        ctx.font = 'bold 26px sans-serif'; ctx.fillStyle = '#e11d48'; ctx.textAlign = 'center';
        ctx.fillText('🎈 Balloons Popped: ' + score, 400, 45);
        requestAnimationFrame(loop);
      }
      loop();
</script>
</body>
</html>
