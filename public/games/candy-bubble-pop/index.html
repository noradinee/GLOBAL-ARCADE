<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Candy Bubble Pop</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #1a0826; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
#bar { display: flex; justify-content: space-between; width: 480px; max-width: 95vw; padding: 12px 18px; background: #2d1242; border-radius: 12px 12px 0 0; font-size: 16px; font-weight: bold; border: 1px solid #7c3aed; }
canvas { background: #0f0517; border: 1px solid #7c3aed; border-radius: 0 0 12px 12px; box-shadow: 0 0 25px rgba(217,70,239,0.3); max-width: 95vw; max-height: 75vh; cursor: pointer; }
</style>
</head>
<body>
<div id="bar">
  <div>SCORE: <span id="sc" style="color:#f472b6;">0</span></div>
  <div>MOVES: <span id="mv" style="color:#38bdf8;">30</span></div>
  <div>GOAL: <span style="color:#facc15;">2500</span></div>
</div>
<canvas id="c" width="480" height="560"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const R = 8, C = 7, CELL = 60, OX = 30, OY = 40;
const COLORS = ['#f43f5e', '#a855f7', '#38bdf8', '#10b981', '#fbbf24'];
let grid = [], score = 0, moves = 30, particles = [];

function init() {
  for (let r=0; r<R; r++) {
    grid[r] = [];
    for (let c=0; c<C; c++) grid[r][c] = Math.floor(Math.random() * COLORS.length);
  }
}

cv.addEventListener('click', e => {
  if (moves <= 0) { moves = 30; score = 0; init(); return; }
  const rect = cv.getBoundingClientRect();
  const scale = cv.width / rect.width;
  const mx = (e.clientX - rect.left) * scale - OX;
  const my = (e.clientY - rect.top) * scale - OY;
  const col = Math.floor(mx / CELL), row = Math.floor(my / CELL);
  if (row >= 0 && row < R && col >= 0 && col < C) popGroup(row, col);
});

function popGroup(sr, sc) {
  const target = grid[sr][sc];
  if (target === -1) return;
  let visited = Array.from({length: R}, () => Array(C).fill(false));
  let matched = [];
  function flood(r, c) {
    if (r<0||r>=R||c<0||c>=C||visited[r][c]||grid[r][c]!==target) return;
    visited[r][c] = true;
    matched.push({r, c});
    flood(r+1, c); flood(r-1, c); flood(r, c+1); flood(r, c-1);
  }
  flood(sr, sc);
  if (matched.length >= 2) {
    moves--;
    let pts = matched.length * matched.length * 10;
    score += pts;
    matched.forEach(p => {
      grid[p.r][p.c] = -1;
      for (let i=0; i<6; i++) {
        particles.push({
          x: OX + p.c*CELL + CELL/2, y: OY + p.r*CELL + CELL/2,
          vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
          c: COLORS[target], life: 1
        });
      }
    });
    collapse();
    document.getElementById('sc').textContent = score;
    document.getElementById('mv').textContent = moves;
  }
}

function collapse() {
  for (let c=0; c<C; c++) {
    let write = R - 1;
    for (let r=R-1; r>=0; r--) {
      if (grid[r][c] !== -1) {
        grid[write][c] = grid[r][c];
        if (write !== r) grid[r][c] = -1;
        write--;
      }
    }
    for (let r=write; r>=0; r--) grid[r][c] = Math.floor(Math.random() * COLORS.length);
  }
}

function loop() {
  ctx.fillStyle = '#0f0517'; ctx.fillRect(0, 0, cv.width, cv.height);
  for (let r=0; r<R; r++) {
    for (let c=0; c<C; c++) {
      let x = OX + c*CELL + CELL/2, y = OY + r*CELL + CELL/2;
      let val = grid[r][c];
      if (val >= 0) {
        ctx.fillStyle = COLORS[val];
        ctx.beginPath(); ctx.arc(x, y, CELL/2 - 6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath(); ctx.arc(x - 6, y - 6, 6, 0, Math.PI*2); ctx.fill();
      }
    }
  }
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.life -= 0.04;
    ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, p.life);
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);

  if (moves <= 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = score >= 2500 ? '#4ade80' : '#f43f5e';
    ctx.font = 'bold 32px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(score >= 2500 ? 'YOU WIN!' : 'GAME OVER', cv.width/2, cv.height/2 - 20);
    ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif';
    ctx.fillText('Final Score: ' + score + ' | Click to Play Again', cv.width/2, cv.height/2 + 25);
  }
  requestAnimationFrame(loop);
}

init();
loop();
</script>
</body>
</html>
