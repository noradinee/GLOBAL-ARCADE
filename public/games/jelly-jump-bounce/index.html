<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jelly Jump Sky Bounce — KYRAXO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: linear-gradient(135deg, #bae6fd 0%, #fbcfe8 100%); display: flex; flex-direction: column; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  header { height: 50px; background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 2px solid rgba(0,0,0,0.08); z-index: 10; }
  .title { font-size: 16px; font-weight: 800; color: #8b5cf6; }
  .btn { background: #fff; border: 2px solid #8b5cf6; border-radius: 10px; padding: 5px 12px; font-size: 13px; font-weight: 700; cursor: pointer; color: #8b5cf6; }
  #game-wrap { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 8px; }
  canvas { background: #ffffff; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); max-width: 100%; max-height: 100%; touch-action: none; }
</style>
</head>
<body>
<header>
  <div class="title">Jelly Jump Sky Bounce</div>
  <button class="btn" onclick="if(window.resetGame)resetGame()">Reset</button>
</header>
<div id="game-wrap">
  <canvas id="c"></canvas>
</div>
<script>
function playSfx(freq = 440, type = 'sine', dur = 0.1, vol = 0.2) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, ac.currentTime);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch(e) {}
}
function playArp(notes, dur = 0.08) {
  notes.forEach((f, i) => setTimeout(() => playSfx(f, 'triangle', 0.2, 0.25), i * dur * 1000));
}
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 800; canvas.height = 500;
function saveCanvas() {
  playSfx(660);
  const a = document.createElement('a');
  a.download = 'jelly-jump-bounce.png';
  a.href = canvas.toDataURL();
  a.click();
}

      let jelly = { x: 400, y: 350, vy: 0 };
      let platforms = [{ x: 340, y: 400, w: 120 }, { x: 200, y: 280, w: 120 }, { x: 480, y: 160, w: 120 }];
      let heightScore = 0;
      function resetGame() { jelly.x = 400; jelly.y = 350; jelly.vy = 0; heightScore = 0; }
      canvas.addEventListener('pointerdown', e => {
        const r = canvas.getBoundingClientRect();
        jelly.x = (e.clientX - r.left) * (canvas.width / r.width);
      });
      function loop() {
        ctx.fillStyle = '#f0f9ff'; ctx.fillRect(0, 0, 800, 500);
        // Physics
        jelly.vy += 0.4;
        jelly.y += jelly.vy;
        platforms.forEach(p => {
          if (jelly.vy > 0 && jelly.y > p.y - 20 && jelly.y < p.y + 10 && jelly.x > p.x && jelly.x < p.x + p.w) {
            jelly.vy = -12; playSfx(600, 'triangle', 0.12); heightScore += 10;
          }
        });
        if (jelly.y > 520) { jelly.y = 350; jelly.vy = -12; }
        // Platforms
        ctx.fillStyle = '#38bdf8';
        platforms.forEach(p => {
          ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, 20, 10); ctx.fill();
        });
        // Jelly character
        ctx.font = '48px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🍮', jelly.x, jelly.y);
        ctx.font = 'bold 24px sans-serif'; ctx.fillStyle = '#8b5cf6'; ctx.textAlign = 'left';
        ctx.fillText('Height: ' + heightScore + 'm', 30, 45);
        requestAnimationFrame(loop);
      }
      loop();
</script>
</body>
</html>
