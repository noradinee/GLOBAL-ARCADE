<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kids Fun Drum Kit — KYRAXO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: linear-gradient(135deg, #fed7aa 0%, #fbcfe8 100%); display: flex; flex-direction: column; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  header { height: 50px; background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 2px solid rgba(0,0,0,0.08); z-index: 10; }
  .title { font-size: 16px; font-weight: 800; color: #ea580c; }
  .btn { background: #fff; border: 2px solid #ea580c; border-radius: 10px; padding: 5px 12px; font-size: 13px; font-weight: 700; cursor: pointer; color: #ea580c; }
  #game-wrap { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 8px; }
  canvas { background: #ffffff; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); max-width: 100%; max-height: 100%; touch-action: none; }
</style>
</head>
<body>
<header>
  <div class="title">Kids Fun Drum Kit</div>
  <button class="btn" onclick="if(window.resetGame)resetGame()">Reset</button>
</header>
<div id="game-wrap">
  <canvas id="c"></canvas>
</div>
<script>
function playSfx(freq = 440, type = 'sine', dur = 0.1, vol = 0.2) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, ac.currentTime);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch(e) {}
}
function playArp(notes, dur = 0.08) {
  notes.forEach((f, i) => setTimeout(() => playSfx(f, 'triangle', 0.2, 0.25), i * dur * 1000));
}
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 800; canvas.height = 500;
function saveCanvas() {
  playSfx(660);
  const a = document.createElement('a');
  a.download = 'kids-drum-kit.png';
  a.href = canvas.toDataURL();
  a.click();
}

      const drums = [
        { name: 'Snare', x: 260, y: 310, r: 60, col: '#f43f5e', f: 220, type: 'sawtooth' },
        { name: 'Bass Kick', x: 400, y: 330, r: 85, col: '#0284c7', f: 80, type: 'sine' },
        { name: 'Tom', x: 540, y: 310, r: 60, col: '#10b981', f: 160, type: 'triangle' },
        { name: 'Crash Cymbal', x: 280, y: 150, r: 50, col: '#facc15', f: 800, type: 'square' },
        { name: 'Hi-Hat', x: 520, y: 150, r: 50, col: '#facc15', f: 650, type: 'square' }
      ];
      let hitIdx = -1;
      function resetGame() { hitIdx = -1; }
      canvas.addEventListener('pointerdown', e => {
        const r = canvas.getBoundingClientRect();
        const x = (e.clientX - r.left) * (canvas.width / r.width);
        const y = (e.clientY - r.top) * (canvas.height / r.height);
        drums.forEach((d, i) => {
          if (Math.hypot(x - d.x, y - d.y) < d.r) {
            hitIdx = i;
            playSfx(d.f, d.type, 0.15, 0.4);
            setTimeout(() => hitIdx = -1, 150);
          }
        });
      });
      function loop() {
        ctx.fillStyle = '#fff7ed'; ctx.fillRect(0, 0, 800, 500);
        drums.forEach((d, i) => {
          ctx.save();
          if (i === hitIdx) { ctx.translate(d.x, d.y); ctx.scale(1.1, 1.1); ctx.translate(-d.x, -d.y); }
          ctx.fillStyle = d.col; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6; ctx.stroke();
          ctx.font = 'bold 16px sans-serif'; ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(d.name, d.x, d.y);
          ctx.restore();
        });
        requestAnimationFrame(loop);
      }
      loop();
</script>
</body>
</html>
