<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mahjong Solitaire Zen — KYRAXO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: linear-gradient(135deg, #064e3b 0%, #022c22 100%); display: flex; flex-direction: column; font-family: system-ui, -apple-system, sans-serif; touch-action: none; color: #fff; }
  header { height: 50px; background: rgba(15,23,42,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 10; flex-shrink: 0; }
  .title { font-size: 16px; font-weight: 800; color: #10b981; display: flex; align-items: center; gap: 8px; }
  .btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 700; cursor: pointer; color: #fff; }
  #game-wrap { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 6px; overflow: hidden; }
  canvas { background: #0f291e; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 100%; max-height: 100%; aspect-ratio: 16/10; object-fit: contain; touch-action: none; }
</style>
</head>
<body>
<header>
  <div class="title">
    <span>🀄</span>
    <span>Mahjong Solitaire Zen</span>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn" onclick="if(window.resetGame)resetGame();">Reset</button>
  </div>
</header>
<div id="game-wrap">
  <canvas id="c"></canvas>
</div>
<script>
function playSfx(freq = 440, type = 'sine', dur = 0.1, vol = 0.2) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, ac.currentTime);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch(e) {}
}
function notifyParent(eventType) {
  try {
    window.parent.postMessage({ type: eventType }, '*');
  } catch(e) {}
}
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 800; canvas.height = 500;

      let tiles = [
        { v: '🀄', x: 260, y: 150, matched: false },
        { v: '🀄', x: 480, y: 150, matched: false },
        { v: '🎋', x: 300, y: 260, matched: false },
        { v: '🎋', x: 440, y: 260, matched: false }
      ];
      let selected = null;
      function resetGame() { tiles.forEach(t => t.matched = false); selected = null; }
      canvas.addEventListener('pointerdown', e => {
        const r = canvas.getBoundingClientRect();
        const x = (e.clientX - r.left)*(canvas.width/r.width);
        const y = (e.clientY - r.top)*(canvas.height/r.height);
        tiles.forEach(t => {
          if (!t.matched && Math.hypot(x - t.x, y - t.y) < 40) {
            if (!selected) { selected = t; playSfx(440, 'sine', 0.1); }
            else if (selected !== t && selected.v === t.v) {
              selected.matched = true; t.matched = true; selected = null;
              playSfx(784, 'triangle', 0.3); notifyParent('WIN');
            } else { selected = null; playSfx(220, 'sawtooth', 0.1); }
          }
        });
      });
      function loop() {
        ctx.fillStyle = '#0f291e'; ctx.fillRect(0, 0, 800, 500);
        tiles.forEach(t => {
          if (!t.matched) {
            ctx.fillStyle = selected === t ? '#fef08a' : '#f8fafc';
            ctx.roundRect ? ctx.roundRect(t.x - 35, t.y - 45, 70, 90, 10) : ctx.rect(t.x - 35, t.y - 45, 70, 90); ctx.fill();
            ctx.fillStyle = '#000'; ctx.font = '45px system-ui'; ctx.textAlign = 'center'; ctx.fillText(t.v, t.x, t.y + 16);
          }
        });
        requestAnimationFrame(loop);
      }
      loop();
</script>
</body>
</html>
