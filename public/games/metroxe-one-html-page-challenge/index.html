<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>One Html Page Challenge</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #000; color: #00ff66; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; touch-action: none; }
#matrix { border: 1px solid #00ff66; box-shadow: 0 0 25px rgba(0,255,102,0.3); max-width: 95vw; max-height: 85vh; }
#info { margin-top: 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; }
</style>
</head>
<body>
<canvas id="matrix" width="600" height="600"></canvas>
<div id="info">Cyber Matrix Sandbox // Click to Spawn Particles // Move to Ripple</div>
<script>
const cv = document.getElementById('matrix'), ctx = cv.getContext('2d');
let pts = [];
for (let i=0; i<120; i++) {
  pts.push({
    x: Math.random()*cv.width, y: Math.random()*cv.height,
    vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2,
    sz: 1.5 + Math.random()*2
  });
}
let mx = 300, my = 300;
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  mx = (e.clientX - r.left) * (cv.width / r.width);
  my = (e.clientY - r.top) * (cv.height / r.height);
});
cv.addEventListener('touchmove', e => {
  if (!e.touches[0]) return;
  const r = cv.getBoundingClientRect();
  mx = (e.touches[0].clientX - r.left) * (cv.width / r.width);
  my = (e.touches[0].clientY - r.top) * (cv.height / r.height);
}, { passive: true });
cv.addEventListener('click', e => {
  for (let i=0; i<20; i++) {
    pts.push({
      x: mx, y: my,
      vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
      sz: 2 + Math.random()*3
    });
  }
});

function draw() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; ctx.fillRect(0, 0, cv.width, cv.height);
  for (let i=0; i<pts.length; i++) {
    let p = pts[i];
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > cv.width) p.vx *= -1;
    if (p.y < 0 || p.y > cv.height) p.vy *= -1;

    let d = Math.hypot(p.x - mx, p.y - my);
    if (d < 100) { p.x += (p.x - mx)*0.03; p.y += (p.y - my)*0.03; }

    ctx.fillStyle = '#00ff66';
    ctx.fillRect(p.x, p.y, p.sz, p.sz);

    for (let j=i+1; j<pts.length; j++) {
      let p2 = pts[j];
      let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
      if (dist < 65) {
        ctx.strokeStyle = 'rgba(0, 255, 102, ' + (1 - dist/65)*0.4 + ')';
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }
    }
  }
  if (pts.length > 250) pts.splice(0, 20);
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
