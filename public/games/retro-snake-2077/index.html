<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Snake 2077</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%;
      background: #06070b;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100%;
      max-width: 600px;
      max-height: 700px;
      padding: 10px;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      color: #38bdf8;
      font-weight: 800;
      font-size: 18px;
      padding: 8px 16px;
      background: #0f1322;
      border: 1px solid #1e293b;
      border-radius: 12px;
      margin-bottom: 10px;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }
    #canvas-container {
      position: relative;
      flex: 1;
      width: 100%;
      max-height: 480px;
      background: #0a0d18;
      border: 2px solid #8b5cf6;
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.35);
      border-radius: 12px;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Mobile D-Pad */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 54px);
      grid-template-rows: repeat(2, 46px);
      gap: 6px;
      margin-top: 10px;
      justify-content: center;
    }
    .dpad-btn {
      background: #1e2538;
      border: 1px solid #3b4566;
      color: #38bdf8;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
    .dpad-btn:active {
      background: #8b5cf6;
      color: white;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 13, 24, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }
    .btn {
      padding: 12px 32px;
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #06070b;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div class="hud">
      <div>SCORE: <span id="score">0</span></div>
      <div>BEST: <span id="highScore">0</span></div>
      <div>SPEED: <span id="speedLvl">1x</span></div>
    </div>
    
    <div id="canvas-container">
      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <div id="startOverlay" class="overlay">
        <h1 style="color: #10b981; font-size: 32px; font-weight: 900; letter-spacing: 2px;">RETRO SNAKE 2077</h1>
        <p style="color: #94a3b8; margin-top: 8px;">Eat cyber cores and survive the grid</p>
        <button class="btn" id="startBtn">INITIALIZE</button>
      </div>

      <div id="gameOverOverlay" class="overlay" style="display: none;">
        <h2 style="color: #f43f5e; font-size: 32px; font-weight: 900;">SIGNAL LOST</h2>
        <p style="color: #cbd5e1; margin-top: 8px;">Score: <span id="finalScore" style="color: #38bdf8; font-weight: bold;">0</span></p>
        <button class="btn" id="restartBtn">RECONNECT</button>
      </div>
    </div>

    <!-- On screen controls for tablet/mobile -->
    <div class="dpad">
      <div></div>
      <button class="dpad-btn" data-dir="UP">▲</button>
      <div></div>
      <button class="dpad-btn" data-dir="LEFT">◀</button>
      <button class="dpad-btn" data-dir="DOWN">▼</button>
      <button class="dpad-btn" data-dir="RIGHT">▶</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('highScore');
    const speedEl = document.getElementById('speedLvl');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScoreEl = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    // Web Audio Sound FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, type = 'sine', duration = 0.1) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    const GRID_SIZE = 20;
    const TILE_COUNT = 20; // 400x400
    let snake = [];
    let food = { x: 15, y: 15, pulse: 0 };
    let superFood = null;
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snake_2077_high') || '0', 10);
    highEl.textContent = highScore;
    let isRunning = false;
    let gameLoop = null;
    let currentSpeed = 110;

    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      currentSpeed = 110;
      scoreEl.textContent = '0';
      speedEl.textContent = '1x';
      spawnFood();
      superFood = null;
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * TILE_COUNT),
        y: Math.floor(Math.random() * TILE_COUNT),
        pulse: 0
      };
      // Don't spawn on snake
      for (let s of snake) {
        if (s.x === food.x && s.y === food.y) {
          spawnFood();
          break;
        }
      }
    }

    function tick() {
      if (!isRunning) return;

      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        return gameOver();
      }

      // Self collision
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          return gameOver();
        }
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        beep(520, 'triangle', 0.12);
        spawnFood();

        // Speed ramp
        if (score % 50 === 0 && currentSpeed > 60) {
          currentSpeed -= 6;
          speedEl.textContent = (110 / currentSpeed).toFixed(1) + 'x';
          clearInterval(gameLoop);
          gameLoop = setInterval(tick, currentSpeed);
        }
      } else {
        snake.pop();
      }

      render();
    }

    function render() {
      ctx.fillStyle = '#0a0d18';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid background
      ctx.strokeStyle = '#141829';
      ctx.lineWidth = 1;
      for (let i = 0; i <= TILE_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID_SIZE, 0);
        ctx.lineTo(i * GRID_SIZE, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * GRID_SIZE);
        ctx.lineTo(canvas.width, i * GRID_SIZE);
        ctx.stroke();
      }

      // Draw food
      food.pulse += 0.1;
      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 12;
      const size = GRID_SIZE - 4 + Math.sin(food.pulse) * 2;
      ctx.beginPath();
      ctx.arc(
        food.x * GRID_SIZE + GRID_SIZE / 2,
        food.y * GRID_SIZE + GRID_SIZE / 2,
        size / 2,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw Snake
      snake.forEach((seg, idx) => {
        if (idx === 0) {
          // Head
          ctx.fillStyle = '#10b981';
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 14;
        } else {
          // Body gradient
          ctx.fillStyle = '#06b6d4';
          ctx.shadowBlur = 0;
        }

        ctx.fillRect(
          seg.x * GRID_SIZE + 2,
          seg.y * GRID_SIZE + 2,
          GRID_SIZE - 4,
          GRID_SIZE - 4
        );
      });
      ctx.shadowBlur = 0;
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      beep(150, 'sawtooth', 0.35);
      finalScoreEl.textContent = score;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snake_2077_high', highScore);
        highEl.textContent = highScore;
      }
      gameOverOverlay.style.display = 'flex';
    }

    function startGame() {
      init();
      isRunning = true;
      startOverlay.style.display = 'none';
      gameOverOverlay.style.display = 'none';
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, currentSpeed);
      render();
    }

    function handleDir(dir) {
      if (dir === 'UP' && dy !== 1) { nextDx = 0; nextDy = -1; }
      if (dir === 'DOWN' && dy !== -1) { nextDx = 0; nextDy = 1; }
      if (dir === 'LEFT' && dx !== 1) { nextDx = -1; nextDy = 0; }
      if (dir === 'RIGHT' && dx !== -1) { nextDx = 1; nextDy = 0; }
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) handleDir('UP');
      if (['ArrowDown', 'KeyS'].includes(e.code)) handleDir('DOWN');
      if (['ArrowLeft', 'KeyA'].includes(e.code)) handleDir('LEFT');
      if (['ArrowRight', 'KeyD'].includes(e.code)) handleDir('RIGHT');
      if (e.code === 'Space' && !isRunning) startGame();
    });

    document.querySelectorAll('.dpad-btn').forEach(b => {
      b.addEventListener('click', () => handleDir(b.dataset.dir));
      b.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleDir(b.dataset.dir);
      });
    });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
    render();
  </script>
</body>
</html>
