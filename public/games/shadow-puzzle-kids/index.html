<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Shadow Puzzle Kids — KYRAXO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: linear-gradient(135deg, #fed7aa 0%, #bae6fd 100%); display: flex; flex-direction: column; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  header { height: 50px; background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 2px solid rgba(0,0,0,0.08); z-index: 10; }
  .title { font-size: 16px; font-weight: 800; color: #0284c7; }
  .btn { background: #fff; border: 2px solid #0284c7; border-radius: 10px; padding: 5px 12px; font-size: 13px; font-weight: 700; cursor: pointer; color: #0284c7; }
  #game-wrap { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 8px; }
  canvas { background: #ffffff; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); max-width: 100%; max-height: 100%; touch-action: none; }
</style>
</head>
<body>
<header>
  <div class="title">Shadow Puzzle Kids</div>
  <button class="btn" onclick="if(window.resetGame)resetGame()">Reset</button>
</header>
<div id="game-wrap">
  <canvas id="c"></canvas>
</div>
<script>
function playSfx(freq = 440, type = 'sine', dur = 0.1, vol = 0.2) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, ac.currentTime);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch(e) {}
}
function playArp(notes, dur = 0.08) {
  notes.forEach((f, i) => setTimeout(() => playSfx(f, 'triangle', 0.2, 0.25), i * dur * 1000));
}
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 800; canvas.height = 500;
function saveCanvas() {
  playSfx(660);
  const a = document.createElement('a');
  a.download = 'shadow-puzzle-kids.png';
  a.href = canvas.toDataURL();
  a.click();
}

      const animals = ['🐘', '🦒', '🦁', '🐬'];
      let matched = [false, false, false, false];
      function resetGame() { matched = [false, false, false, false]; playSfx(300); }
      canvas.addEventListener('pointerdown', e => {
        const r = canvas.getBoundingClientRect();
        const x = (e.clientX - r.left) * (canvas.width / r.width);
        const y = (e.clientY - r.top) * (canvas.height / r.height);
        if (y > 300) {
          const idx = Math.floor((x - 100) / 150);
          if (idx >= 0 && idx < animals.length && !matched[idx]) {
            matched[idx] = true;
            playSfx(550 + idx * 80);
            if (matched.every(Boolean)) playArp([440, 554, 659, 880]);
          }
        }
      });
      function loop() {
        ctx.fillStyle = '#fffbeb'; ctx.fillRect(0, 0, 800, 500);
        // Shadows at top
        animals.forEach((a, i) => {
          const x = 180 + i * 150;
          if (matched[i]) {
            ctx.font = '64px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(a, x, 180);
          } else {
            ctx.font = '64px sans-serif'; ctx.textAlign = 'center';
            ctx.fillStyle = '#1e293b'; ctx.fillText(a, x, 180);
          }
        });
        // Animal selector pieces at bottom
        animals.forEach((a, i) => {
          const x = 180 + i * 150;
          if (!matched[i]) {
            ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 50, 320, 100, 100);
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3; ctx.strokeRect(x - 50, 320, 100, 100);
            ctx.font = '54px sans-serif'; ctx.fillText(a, x, 385);
          }
        });
        ctx.font = 'bold 24px sans-serif'; ctx.fillStyle = '#0284c7'; ctx.textAlign = 'center';
        ctx.fillText('Tap the animal that matches each shadow! 🐾', 400, 50);
        requestAnimationFrame(loop);
      }
      loop();
</script>
</body>
</html>
