<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cyber Simon Color Sequence — KYRAXO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #080c14; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; touch-action: none; }
  canvas { display: block; max-width: 100%; max-height: 100%; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>

const c = document.getElementById('c'), ctx = c.getContext('2d');
c.width = 500; c.height = 500;
const COLORS = [
  { name: 'green', base: '#15803d', lit: '#4ade80', freq: 261, x: 25, y: 25 },
  { name: 'red', base: '#b91c1c', lit: '#f87171', freq: 329, x: 255, y: 25 },
  { name: 'yellow', base: '#b45309', lit: '#fde047', freq: 392, x: 25, y: 255 },
  { name: 'blue', base: '#1d4ed8', lit: '#60a5fa', freq: 523, x: 255, y: 255 }
];
let seq = []; let playerIdx = 0; let active = null; let state = 'wait'; let score = 0;
function beep(freq) { try { const a = new (window.AudioContext||window.webkitAudioContext)(); const o = a.createOscillator(); o.frequency.value = freq; o.connect(a.destination); o.start(); o.stop(a.currentTime + 0.25); } catch(e){} }
function start() { seq = [Math.floor(Math.random()*4)]; score = 0; playerIdx = 0; playSeq(); }
function playSeq() {
  state = 'playback'; let i = 0;
  const interval = setInterval(() => {
    flash(seq[i]); i++;
    if (i >= seq.length) { clearInterval(interval); setTimeout(() => { state = 'input'; playerIdx = 0; draw(); }, 400); }
  }, 600);
}
function flash(idx) { active = idx; beep(COLORS[idx].freq); draw(); setTimeout(() => { active = null; draw(); }, 300); }
function tap(colIdx) {
  if (state === 'wait') { start(); return; }
  if (state !== 'input') return;
  flash(colIdx);
  if (colIdx === seq[playerIdx]) {
    playerIdx++;
    if (playerIdx >= seq.length) {
      score++; state = 'wait';
      setTimeout(() => { seq.push(Math.floor(Math.random()*4)); playSeq(); }, 600);
    }
  } else {
    beep(120); state = 'over'; draw();
  }
}
c.addEventListener('pointerdown', e => {
  const r = c.getBoundingClientRect();
  const x = (e.clientX - r.left) * (500 / r.width);
  const y = (e.clientY - r.top) * (500 / r.height);
  if (state === 'wait' || state === 'over') { start(); return; }
  if (x < 250 && y < 250) tap(0);
  else if (x >= 250 && y < 250) tap(1);
  else if (x < 250 && y >= 250) tap(2);
  else tap(3);
});
function draw() {
  ctx.fillStyle = '#080c14'; ctx.fillRect(0, 0, 500, 500);
  for (let i = 0; i < 4; i++) {
    const clr = COLORS[i]; ctx.fillStyle = (active === i) ? clr.lit : clr.base;
    ctx.beginPath(); ctx.roundRect(clr.x, clr.y, 220, 220, 24); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = (active === i) ? '#ffffff' : '#0f172a'; ctx.stroke();
  }
  ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(250, 250, 65, 0, Math.PI*2); ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#38bdf8'; ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center';
  ctx.fillText(state === 'over' ? 'OVER' : 'SCORE', 250, 245);
  ctx.font = 'bold 28px monospace'; ctx.fillText(score, 250, 275);
  ctx.textAlign = 'start';
}
draw();
</script>
</body>
</html>
