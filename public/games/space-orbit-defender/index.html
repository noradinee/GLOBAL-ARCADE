<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Orbit Defender</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%;
      background: #030408;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 800px;
      max-height: 600px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #050711;
    }
    .hud {
      position: absolute;
      top: 14px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      color: #38bdf8;
      font-weight: 800;
      font-size: 18px;
      pointer-events: none;
      z-index: 10;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 4, 8, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 20;
    }
    .btn {
      padding: 12px 34px;
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: white;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.5);
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <div>SCORE: <span id="scoreVal">0</span></div>
      <div>CORE HEALTH: <span id="hpVal" style="color: #10b981;">100%</span></div>
      <div>WAVE: <span id="waveVal">1</span></div>
    </div>
    <canvas id="canvas"></canvas>

    <div id="startOverlay" class="overlay">
      <h1 style="font-size: 32px; font-weight: 900; color: #38bdf8; text-transform: uppercase;">SPACE ORBIT DEFENDER</h1>
      <p style="color: #94a3b8; margin-top: 8px; text-align: center;">Move mouse or touch around the planet to rotate your defender ship.<br/>Click / Tap or press [SPACE] to fire photon torpedoes!</p>
      <button class="btn" id="startBtn">ENGAGE DEFENSES</button>
    </div>

    <div id="gameOverOverlay" class="overlay" style="display: none;">
      <h2 style="font-size: 32px; font-weight: 900; color: #f43f5e;">PLANETARY CORE DESTROYED</h2>
      <p style="color: #cbd5e1; margin-top: 8px;">Final Score: <span id="finalScore" style="color: #38bdf8; font-weight: bold;">0</span></p>
      <button class="btn" id="restartBtn">DEFEND AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const hpVal = document.getElementById('hpVal');
    const waveVal = document.getElementById('waveVal');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScore = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function sound(freq, type = 'sine', duration = 0.1) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    let W, H, CX, CY;
    function resize() {
      const container = document.getElementById('game-container');
      W = canvas.width = container.clientWidth;
      H = canvas.height = container.clientHeight;
      CX = W / 2;
      CY = H / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    const PLANET_RADIUS = 36;
    const ORBIT_RADIUS = 76;
    let playerAngle = 0;
    let targetAngle = 0;
    let bullets = [];
    let enemies = [];
    let particles = [];
    let stars = [];
    let coreHP = 100;
    let score = 0;
    let wave = 1;
    let isPlaying = false;
    let spawnTimer = 0;

    for (let i = 0; i < 80; i++) {
      stars.push({
        x: Math.random() * 1000,
        y: Math.random() * 800,
        r: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.8 + 0.2
      });
    }

    function shoot() {
      if (!isPlaying) return;
      sound(680, 'sine', 0.08);
      const bx = CX + Math.cos(playerAngle) * ORBIT_RADIUS;
      const by = CY + Math.sin(playerAngle) * ORBIT_RADIUS;
      const speed = 9;
      bullets.push({
        x: bx,
        y: by,
        vx: Math.cos(playerAngle) * speed,
        vy: Math.sin(playerAngle) * speed,
        life: 70
      });
    }

    function spawnEnemy() {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.hypot(W, H) / 2 + 30;
      const ex = CX + Math.cos(angle) * dist;
      const ey = CY + Math.sin(angle) * dist;
      const speed = 1.2 + (wave * 0.2);
      const toCoreAngle = Math.atan2(CY - ey, CX - ex);

      enemies.push({
        x: ex,
        y: ey,
        vx: Math.cos(toCoreAngle) * speed,
        vy: Math.sin(toCoreAngle) * speed,
        r: 12 + Math.random() * 8,
        hp: 1 + Math.floor(wave / 3),
        color: Math.random() > 0.4 ? '#f43f5e' : '#ec4899'
      });
    }

    function update() {
      if (!isPlaying) return;

      // Smooth rotate towards target
      let diff = targetAngle - playerAngle;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      playerAngle += diff * 0.18;

      spawnTimer++;
      if (spawnTimer % Math.max(30, 90 - wave * 5) === 0) {
        spawnEnemy();
      }

      // Wave progression
      if (spawnTimer % 600 === 0) {
        wave++;
        waveVal.textContent = wave;
      }

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        // Check enemy hit
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
            e.hp--;
            sound(340, 'triangle', 0.1);
            bullets.splice(i, 1);

            if (e.hp <= 0) {
              score += 20;
              scoreVal.textContent = score;
              sound(180, 'sawtooth', 0.18);
              // Explosion particles
              for (let p = 0; p < 12; p++) {
                particles.push({
                  x: e.x,
                  y: e.y,
                  vx: (Math.random() - 0.5) * 6,
                  vy: (Math.random() - 0.5) * 6,
                  color: e.color,
                  life: 25
                });
              }
              enemies.splice(j, 1);
            }
            break;
          }
        }

        if (b.life <= 0) bullets.splice(i, 1);
      }

      // Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x += e.vx;
        e.y += e.vy;

        // Core hit
        if (Math.hypot(e.x - CX, e.y - CY) < PLANET_RADIUS + e.r) {
          coreHP -= 15;
          sound(110, 'sawtooth', 0.35);
          hpVal.textContent = Math.max(0, coreHP) + '%';
          if (coreHP <= 30) hpVal.style.color = '#f43f5e';

          for (let p = 0; p < 16; p++) {
            particles.push({
              x: e.x,
              y: e.y,
              vx: (Math.random() - 0.5) * 7,
              vy: (Math.random() - 0.5) * 7,
              color: '#f59e0b',
              life: 30
            });
          }

          enemies.splice(i, 1);

          if (coreHP <= 0) {
            gameOver();
            return;
          }
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function gameOver() {
      isPlaying = false;
      gameOverOverlay.style.display = 'flex';
      finalScore.textContent = score;
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Stars
      stars.forEach(s => {
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x % W, s.y % H, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Planet Orbit line
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.2)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(CX, CY, ORBIT_RADIUS, 0, Math.PI * 2);
      ctx.stroke();

      // Planet Core
      const grad = ctx.createRadialGradient(CX, CY, 5, CX, CY, PLANET_RADIUS);
      grad.addColorStop(0, '#38bdf8');
      grad.addColorStop(0.7, '#1e40af');
      grad.addColorStop(1, '#090d24');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(CX, CY, PLANET_RADIUS, 0, Math.PI * 2);
      ctx.fill();

      // Core Shield glow
      ctx.strokeStyle = coreHP > 30 ? 'rgba(56, 189, 248, 0.6)' : 'rgba(244, 63, 94, 0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(CX, CY, PLANET_RADIUS + 4, 0, Math.PI * 2);
      ctx.stroke();

      // Player Ship
      const px = CX + Math.cos(playerAngle) * ORBIT_RADIUS;
      const py = CY + Math.sin(playerAngle) * ORBIT_RADIUS;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(playerAngle + Math.PI / 2);

      ctx.fillStyle = '#06b6d4';
      ctx.shadowColor = '#06b6d4';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(0, -12);
      ctx.lineTo(8, 10);
      ctx.lineTo(0, 6);
      ctx.lineTo(-8, 10);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Bullets
      bullets.forEach(b => {
        ctx.fillStyle = '#fde047';
        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.shadowBlur = 0;

      // Enemies
      enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.shadowBlur = 0;

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2, 2);
      });

      requestAnimationFrame(draw);
      update();
    }

    requestAnimationFrame(draw);

    function handleAim(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      targetAngle = Math.atan2(y - CY, x - CX);
    }

    window.addEventListener('mousemove', (e) => handleAim(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (e.touches[0]) handleAim(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    window.addEventListener('mousedown', shoot);
    window.addEventListener('touchstart', (e) => {
      if (e.touches[0]) handleAim(e.touches[0].clientX, e.touches[0].clientY);
      shoot();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        shoot();
      }
    });

    function start() {
      bullets = [];
      enemies = [];
      particles = [];
      coreHP = 100;
      score = 0;
      wave = 1;
      scoreVal.textContent = '0';
      hpVal.textContent = '100%';
      hpVal.style.color = '#10b981';
      waveVal.textContent = '1';
      isPlaying = true;
      startOverlay.style.display = 'none';
      gameOverOverlay.style.display = 'none';
    }

    startBtn.addEventListener('click', start);
    restartBtn.addEventListener('click', start);
  </script>
</body>
</html>
