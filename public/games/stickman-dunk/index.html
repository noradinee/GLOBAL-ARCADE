<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stickman Dunk</title><style>body{margin:0;background:#05070e;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;}#hud{display:flex;justify-content:space-between;width:750px;max-width:95vw;padding:10px 16px;background:rgba(15,23,42,0.9);border-radius:10px 10px 0 0;font-size:16px;font-weight:bold;}canvas{touch-action:none;background:#0b0f1d;border:1px solid #f97316;border-radius:0 0 10px 10px;max-width:95vw;max-height:75vh;}#tip{margin-top:8px;font-size:13px;color:#f97316;}</style></head><body><div id="hud"><div>DUNKS: <span style="color:#f97316;" id="score">0</span></div><div>STREAK: <span style="color:#facc15;" id="streak">x1</span></div><div>GRAVITY DUNK</div></div><canvas id="c" width="750" height="480"></canvas><div id="tip">🏀 Tap Screen or Press Space to Jump and Slam Dunk into the Hoop!</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let score=0,ball={x:200,y:250,vy:0},hoop={x:550,y:220},jumping=false;window.addEventListener('keydown',e=>{if(e.code==='Space')tap();});cv.addEventListener('pointerdown',tap);function tap(){ball.vy=-9.5;}function loop(){ctx.fillStyle='#090d18';ctx.fillRect(0,0,cv.width,cv.height);ball.vy+=0.38;ball.y+=ball.vy;if(ball.y>410){ball.y=410;ball.vy=0;}ctx.fillStyle='#94a3b8';ctx.fillRect(hoop.x+60,hoop.y-50,8,120);ctx.strokeStyle='#f97316';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(hoop.x,hoop.y);ctx.lineTo(hoop.x+60,hoop.y);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(hoop.x,hoop.y);ctx.lineTo(hoop.x+15,hoop.y+45);ctx.lineTo(hoop.x+45,hoop.y+45);ctx.lineTo(hoop.x+60,hoop.y);ctx.stroke();let px=ball.x-30,py=ball.y;ctx.strokeStyle='#38bdf8';ctx.lineWidth=5;ctx.beginPath();ctx.arc(px,py-30,12,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(px,py-18);ctx.lineTo(px,py+25);ctx.lineTo(px-15,py+60);ctx.moveTo(px,py+25);ctx.lineTo(px+15,py+60);ctx.moveTo(px,py-5);ctx.lineTo(ball.x,ball.y);ctx.stroke();ctx.fillStyle='#f97316';ctx.beginPath();ctx.arc(ball.x,ball.y,14,0,Math.PI*2);ctx.fill();if(ball.x>hoop.x&&ball.x<hoop.x+60&&ball.y>hoop.y&&ball.y<hoop.y+20&&ball.vy>0){score++;document.getElementById('score').textContent=score;ball.x=200;ball.y=250;ball.vy=-6;hoop.y=160+Math.random()*150;}requestAnimationFrame(loop);}loop();</script></body></html>
