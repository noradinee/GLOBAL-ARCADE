<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stickman Skater</title><style>body{margin:0;background:#030712;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;}#hud{display:flex;justify-content:space-between;width:750px;max-width:95vw;padding:10px 16px;background:rgba(15,23,42,0.9);border-radius:10px 10px 0 0;font-size:16px;font-weight:bold;}canvas{touch-action:none;background:#0a0f1d;border:1px solid #0ea5e9;border-radius:0 0 10px 10px;max-width:95vw;max-height:75vh;}#tip{margin-top:8px;font-size:13px;color:#0ea5e9;}</style></head><body><div id="hud"><div>AIR TIME: <span style="color:#0ea5e9;" id="air">0</span> s</div><div>TRICK SCORE: <span style="color:#facc15;" id="score">0</span></div><div>HALFPIPE</div></div><canvas id="c" width="750" height="480"></canvas><div id="tip">🛹 Tap / Hold Space or Screen to Pump speed up the halfpipe ramp! Release at peak to jump.</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let x=375,vx=4,score=0,pumping=false;window.addEventListener('keydown',e=>{if(e.code==='Space')pumping=true;});window.addEventListener('keyup',()=>{pumping=false;});cv.addEventListener('pointerdown',()=>{pumping=true;});window.addEventListener('pointerup',()=>{pumping=false;});function loop(){ctx.fillStyle='#090e1c';ctx.fillRect(0,0,cv.width,cv.height);ctx.strokeStyle='#0ea5e9';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(100,120);ctx.quadraticCurveTo(375,440,650,120);ctx.stroke();x+=vx;if(pumping)vx+=(x<375?0.15:-0.15);if(x<130||x>620){vx*=-0.96;score+=50;document.getElementById('score').textContent=score;}let norm=(x-375)/275;let y=120+(1-norm*norm)*320;ctx.save();ctx.translate(x,y);ctx.rotate(norm*0.8);ctx.fillStyle='#facc15';ctx.fillRect(-25,0,50,8);ctx.strokeStyle='#38bdf8';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-30,10,0,Math.PI*2);ctx.moveTo(0,-20);ctx.lineTo(0,0);ctx.stroke();ctx.restore();requestAnimationFrame(loop);}loop();</script></body></html>
