<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stickman Sniper</title><style>body{margin:0;background:#030712;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;}#hud{display:flex;justify-content:space-between;width:750px;max-width:95vw;padding:8px 16px;background:rgba(15,23,42,0.9);border-radius:10px 10px 0 0;font-size:15px;font-weight:bold;}canvas{touch-action:none;background:#0b1120;border:1px solid #22c55e;border-radius:0 0 10px 10px;max-width:95vw;max-height:75vh;cursor:crosshair;}#tip{margin-top:8px;font-size:13px;color:#22c55e;}</style></head><body><div id="hud"><div>KILLS: <span style="color:#22c55e;" id="score">0</span></div><div>WIND: <span style="color:#38bdf8;" id="wind">+2.1</span> m/s</div><div style="color:#ef4444;">SNIPER SCOPE</div></div><canvas id="c" width="750" height="500"></canvas><div id="tip">🎯 Click or Tap screen to Fire Sniper Rifle! Time your shot with breathing sway.</div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let score=0,mx=375,my=250,recoil=0,sway=0;let targets=[];function spawnTarget(){targets.push({x:-30,y:200+Math.random()*150,speed:1.5+Math.random()*2,alive:true});}for(let i=0;i<4;i++)spawnTarget();cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)*(cv.width/r.width);my=(e.clientY-r.top)*(cv.height/r.height);});cv.addEventListener('click',fire);cv.addEventListener('touchstart',e=>{e.preventDefault();const r=cv.getBoundingClientRect();mx=(e.touches[0].clientX-r.left)*(cv.width/r.width);my=(e.touches[0].clientY-r.top)*(cv.height/r.height);fire();},{passive:false});function fire(){recoil=25;targets.forEach(t=>{if(t.alive&&Math.hypot(t.x-mx,t.y-my)<32){t.alive=false;score++;document.getElementById('score').textContent=score;setTimeout(spawnTarget,1200);}});if(!targets.some(t=>t.alive))spawnTarget();}function loop(){ctx.fillStyle='#090f1d';ctx.fillRect(0,0,cv.width,cv.height);sway+=0.04;let sx=mx+Math.sin(sway)*10,sy=my+Math.cos(sway*0.8)*6+recoil;if(recoil>0)recoil*=0.82;targets.forEach(t=>{if(t.alive){t.x+=t.speed;if(t.x>cv.width+40)t.x=-30;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(t.x,t.y-25,10,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(t.x,t.y-15);ctx.lineTo(t.x,t.y+15);ctx.moveTo(t.x,t.y-5);ctx.lineTo(t.x-12,t.y+5);ctx.moveTo(t.x,t.y-5);ctx.lineTo(t.x+12,t.y+5);ctx.moveTo(t.x,t.y+15);ctx.lineTo(t.x-10,t.y+35);ctx.moveTo(t.x,t.y+15);ctx.lineTo(t.x+10,t.y+35);ctx.stroke();}});ctx.fillStyle='rgba(3,7,18,0.85)';ctx.fillRect(0,0,cv.width,cv.height);ctx.save();ctx.beginPath();ctx.arc(sx,sy,130,0,Math.PI*2);ctx.clip();ctx.fillStyle='#0f172a';ctx.fillRect(0,0,cv.width,cv.height);targets.forEach(t=>{if(t.alive){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(t.x,t.y-25,12,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(t.x,t.y-13);ctx.lineTo(t.x,t.y+20);ctx.moveTo(t.x,t.y-2);ctx.lineTo(t.x-15,t.y+10);ctx.moveTo(t.x,t.y-2);ctx.lineTo(t.x+15,t.y+10);ctx.moveTo(t.x,t.y+20);ctx.lineTo(t.x-12,t.y+42);ctx.moveTo(t.x,t.y+20);ctx.lineTo(t.x+12,t.y+42);ctx.stroke();}});ctx.strokeStyle='#22c55e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx-130,sy);ctx.lineTo(sx+130,sy);ctx.moveTo(sx,sy-130);ctx.lineTo(sx,sy+130);ctx.stroke();ctx.beginPath();ctx.arc(sx,sy,45,0,Math.PI*2);ctx.stroke();ctx.restore();ctx.strokeStyle='#22c55e';ctx.lineWidth=4;ctx.beginPath();ctx.arc(sx,sy,130,0,Math.PI*2);ctx.stroke();requestAnimationFrame(loop);}loop();</script></body></html>
