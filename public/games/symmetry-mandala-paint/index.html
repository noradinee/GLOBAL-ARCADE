<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Symmetry Mandala Paint — KYRAXO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: linear-gradient(135deg, #2e1065 0%, #1e1b4b 100%); display: flex; flex-direction: column; font-family: system-ui, -apple-system, sans-serif; touch-action: none; color: #fff; }
  header { height: 50px; background: rgba(15,23,42,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 10; flex-shrink: 0; }
  .title { font-size: 16px; font-weight: 800; color: #8b5cf6; display: flex; align-items: center; gap: 8px; }
  .btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 700; cursor: pointer; color: #fff; }
  #game-wrap { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 6px; overflow: hidden; }
  canvas { background: #0f172a; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 100%; max-height: 100%; aspect-ratio: 16/10; object-fit: contain; touch-action: none; }
</style>
</head>
<body>
<header>
  <div class="title">
    <span>✨</span>
    <span>Symmetry Mandala Paint</span>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn" onclick="if(window.resetGame)resetGame();">Reset</button>
  </div>
</header>
<div id="game-wrap">
  <canvas id="c"></canvas>
</div>
<script>
function playSfx(freq = 440, type = 'sine', dur = 0.1, vol = 0.2) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, ac.currentTime);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch(e) {}
}
function notifyParent(eventType) {
  try {
    window.parent.postMessage({ type: eventType }, '*');
  } catch(e) {}
}
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 800; canvas.height = 500;

      let colors = ['#f43f5e', '#ec4899', '#d946ef', '#a855f7', '#6366f1', '#06b6d4', '#10b981', '#facc15'];
      let colIdx = 0;
      let isPainting = false;
      function resetGame() { ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,800,500); }
      resetGame();
      canvas.addEventListener('pointerdown', e => { isPainting = true; drawSym(e); playSfx(520, 'sine', 0.05); });
      window.addEventListener('pointermove', e => { if (isPainting) drawSym(e); });
      window.addEventListener('pointerup', () => isPainting = false);
      function drawSym(e) {
        const r = canvas.getBoundingClientRect();
        const cx = 400; const cy = 250;
        const x = (e.clientX - r.left) * (canvas.width / r.width) - cx;
        const y = (e.clientY - r.top) * (canvas.height / r.height) - cy;
        const numArms = 8;
        ctx.fillStyle = colors[colIdx];
        for(let a=0; a<numArms; a++) {
          const ang = (Math.PI * 2 / numArms) * a;
          const rx = x * Math.cos(ang) - y * Math.sin(ang);
          const ry = x * Math.sin(ang) + y * Math.cos(ang);
          ctx.beginPath(); ctx.arc(cx + rx, cy + ry, 8, 0, Math.PI*2); ctx.fill();
        }
      }
      setInterval(() => { colIdx = (colIdx + 1) % colors.length; }, 1500);
</script>
</body>
</html>
