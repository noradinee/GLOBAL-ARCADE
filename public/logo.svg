<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield / Hex -->
  <rect x="8" y="8" width="84" height="84" rx="22" fill="#121520" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#neonGlow)"/>
  
  <!-- Arcade Controller Body -->
  <path d="M28 42 C 28 32, 72 32, 72 42 C 76 56, 75 70, 68 72 C 62 74, 57 66, 50 66 C 43 66, 38 74, 32 72 C 25 70, 24 56, 28 42 Z" fill="#1c2033" stroke="#8b5cf6" stroke-width="2.5" />
  
  <!-- D-Pad -->
  <path d="M38 46 H42 V50 H46 V54 H42 V58 H38 V54 H34 V50 H38 Z" fill="#06b6d4" />
  
  <!-- Action Buttons -->
  <circle cx="62" cy="48" r="3.5" fill="#f43f5e" />
  <circle cx="68" cy="54" r="3.5" fill="#10b981" />
  <circle cx="56" cy="54" r="3.5" fill="#f59e0b" />
  <circle cx="62" cy="60" r="3.5" fill="#8b5cf6" />

  <!-- Center Portal Light -->
  <circle cx="50" cy="50" r="2.5" fill="#ffffff" />
</svg>
