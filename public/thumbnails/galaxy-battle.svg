<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" fill="#050711"/>
  <!-- Space galaxy swirl -->
  <ellipse cx="200" cy="110" rx="140" ry="40" stroke="#8b5cf6" stroke-width="2" opacity="0.4" transform="rotate(-15 200 110)"/>
  <!-- Dogfighting ships -->
  <polygon points="180,90 140,80 150,95 140,110" fill="#06b6d4"/>
  <polygon points="220,95 260,80 250,95 260,110" fill="#f43f5e"/>
  <!-- Laser fire -->
  <line x1="170" y1="92" x2="230" y2="92" stroke="#22c55e" stroke-width="2.5"/>
  <rect x="20" y="20" width="110" height="24" rx="12" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="75" y="36" fill="#60a5fa" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">MULTIPLAYER</text>
  <text x="200" y="215" fill="#ffffff" font-size="20" font-weight="900" font-family="sans-serif" text-anchor="middle" letter-spacing="2">GALAXY BATTLE</text>
</svg>
