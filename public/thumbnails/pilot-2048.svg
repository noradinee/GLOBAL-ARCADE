<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="bg2048" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a" />
      <stop offset="100%" stop-color="#16152b" />
    </linearGradient>
    <linearGradient id="tile2048" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="tileGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#bg2048)"/>

  <!-- Ambient Glow -->
  <circle cx="200" cy="115" r="70" fill="#f59e0b" fill-opacity="0.15" filter="blur(20px)"/>

  <!-- 4x4 Mini Board -->
  <rect x="120" y="38" width="160" height="150" rx="14" fill="#1e1b2e" stroke="#2d2a45" stroke-width="2"/>

  <!-- Tiles Grid -->
  <!-- Row 1 -->
  <rect x="130" y="48" width="30" height="30" rx="6" fill="#2d2a45"/>
  <rect x="166" y="48" width="30" height="30" rx="6" fill="#3b3759"/>
  <text x="181" y="68" fill="#e2e8f0" font-size="13" font-weight="900" font-family="sans-serif" text-anchor="middle">2</text>
  <rect x="202" y="48" width="30" height="30" rx="6" fill="#4a4370"/>
  <text x="217" y="68" fill="#e2e8f0" font-size="13" font-weight="900" font-family="sans-serif" text-anchor="middle">4</text>
  <rect x="238" y="48" width="30" height="30" rx="6" fill="#2d2a45"/>

  <!-- Row 2 -->
  <rect x="130" y="84" width="30" height="30" rx="6" fill="#f97316"/>
  <text x="145" y="104" fill="#ffffff" font-size="13" font-weight="900" font-family="sans-serif" text-anchor="middle">16</text>
  <rect x="166" y="84" width="30" height="30" rx="6" fill="#ea580c"/>
  <text x="181" y="104" fill="#ffffff" font-size="13" font-weight="900" font-family="sans-serif" text-anchor="middle">32</text>
  <rect x="202" y="84" width="30" height="30" rx="6" fill="#e11d48"/>
  <text x="217" y="104" fill="#ffffff" font-size="12" font-weight="900" font-family="sans-serif" text-anchor="middle">128</text>
  <rect x="238" y="84" width="30" height="30" rx="6" fill="#3b3759"/>
  <text x="253" y="104" fill="#e2e8f0" font-size="13" font-weight="900" font-family="sans-serif" text-anchor="middle">8</text>

  <!-- Row 3: Feature 2048 Master Tile -->
  <rect x="130" y="120" width="66" height="58" rx="8" fill="url(#tileGold)" stroke="#fef08a" stroke-width="1.5"/>
  <text x="163" y="157" fill="#78350f" font-size="20" font-weight="900" font-family="sans-serif" text-anchor="middle">2048</text>

  <rect x="202" y="120" width="30" height="30" rx="6" fill="#f59e0b"/>
  <text x="217" y="140" fill="#ffffff" font-size="12" font-weight="900" font-family="sans-serif" text-anchor="middle">64</text>
  <rect x="238" y="120" width="30" height="30" rx="6" fill="#2d2a45"/>

  <!-- Row 4 mini filler -->
  <rect x="202" y="154" width="30" height="24" rx="6" fill="#2d2a45"/>
  <rect x="238" y="154" width="30" height="24" rx="6" fill="#4a4370"/>
  <text x="253" y="171" fill="#e2e8f0" font-size="11" font-weight="900" font-family="sans-serif" text-anchor="middle">4</text>

  <!-- Badge text -->
  <rect x="20" y="20" width="90" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
  <text x="65" y="36" fill="#fbbf24" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">PUZZLE</text>

  <!-- Title text -->
  <text x="200" y="218" fill="#ffffff" font-size="20" font-weight="900" font-family="sans-serif" text-anchor="middle" letter-spacing="2">2048 CLASSIC</text>
</svg>