<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" fill="#080a13"/>
  <!-- Table border -->
  <rect x="50" y="45" width="300" height="130" rx="10" stroke="#232c49" stroke-width="2" fill="#0f1426"/>
  <!-- Center Net -->
  <line x1="200" y1="45" x2="200" y2="175" stroke="#38bdf8" stroke-dasharray="6 6" stroke-width="2"/>
  <!-- Paddles -->
  <rect x="75" y="85" width="10" height="50" rx="4" fill="#06b6d4"/>
  <rect x="315" y="105" width="10" height="50" rx="4" fill="#ec4899"/>
  <!-- Ping Pong Ball -->
  <circle cx="230" cy="115" r="7" fill="#ffffff"/>
  <!-- Motion Trail -->
  <line x1="160" y1="100" x2="225" y2="114" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <rect x="20" y="15" width="110" height="24" rx="12" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1"/>
  <text x="75" y="31" fill="#f472b6" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">TWO PLAYER</text>
  <text x="200" y="215" fill="#ffffff" font-size="20" font-weight="900" font-family="sans-serif" text-anchor="middle" letter-spacing="2">PING PONG CLASH</text>
</svg>
