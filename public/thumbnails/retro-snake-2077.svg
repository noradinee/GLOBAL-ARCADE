<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" fill="#070a13"/>
  <!-- Matrix grid lines -->
  <g stroke="#131c31" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="240"/>
    <line x1="280" y1="0" x2="280" y2="240"/>
    <line x1="320" y1="0" x2="320" y2="240"/>
    <line x1="360" y1="0" x2="360" y2="240"/>
  </g>
  <!-- Glowing snake segments -->
  <rect x="200" y="80" width="30" height="30" rx="6" fill="#10b981"/>
  <rect x="165" y="80" width="30" height="30" rx="6" fill="#06b6d4"/>
  <rect x="130" y="80" width="30" height="30" rx="6" fill="#06b6d4"/>
  <rect x="130" y="115" width="30" height="30" rx="6" fill="#06b6d4"/>
  <rect x="130" y="150" width="30" height="30" rx="6" fill="#06b6d4"/>
  <!-- Glowing food orb -->
  <circle cx="280" cy="95" r="14" fill="#f43f5e"/>
  <circle cx="280" cy="95" r="7" fill="#ffffff"/>
  <!-- Title & category -->
  <rect x="20" y="20" width="90" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="65" y="36" fill="#34d399" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">CASUAL</text>
  <text x="200" y="215" fill="#ffffff" font-size="20" font-weight="900" font-family="sans-serif" text-anchor="middle" letter-spacing="2">RETRO SNAKE 2077</text>
</svg>
