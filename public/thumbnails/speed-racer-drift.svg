<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" fill="#090b14"/>
  <!-- Track curve -->
  <path d="M40 120 C 140 20, 260 20, 360 120 C 360 180, 260 200, 180 180" stroke="#f59e0b" stroke-width="16" fill="none" opacity="0.8"/>
  <path d="M40 120 C 140 20, 260 20, 360 120 C 360 180, 260 200, 180 180" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 8" fill="none"/>
  <!-- Supercar Drift Silhouette -->
  <g transform="translate(250, 70) rotate(35)">
    <rect x="-24" y="-12" width="48" height="24" rx="6" fill="#f59e0b"/>
    <rect x="-8" y="-9" width="16" height="18" rx="2" fill="#1e293b"/>
    <!-- Headlights -->
    <rect x="20" y="-10" width="4" height="6" fill="#38bdf8"/>
    <rect x="20" y="4" width="4" height="6" fill="#38bdf8"/>
    <!-- Smoke particles -->
    <circle cx="-32" cy="-6" r="8" fill="#94a3b8" opacity="0.4"/>
    <circle cx="-42" cy="4" r="12" fill="#94a3b8" opacity="0.2"/>
  </g>
  <rect x="20" y="20" width="90" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
  <text x="65" y="36" fill="#fbbf24" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">RACING</text>
  <text x="200" y="215" fill="#ffffff" font-size="20" font-weight="900" font-family="sans-serif" text-anchor="middle" letter-spacing="2">SPEED RACER DRIFT</text>
</svg>
