<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" fill="#0b0e1a"/>
  <!-- Stacked Neon Blocks -->
  <g transform="translate(110, 40)">
    <rect x="0" y="140" width="180" height="26" rx="4" fill="#06b6d4"/>
    <rect x="15" y="110" width="150" height="26" rx="4" fill="#8b5cf6"/>
    <rect x="30" y="80" width="120" height="26" rx="4" fill="#ec4899"/>
    <rect x="45" y="50" width="90" height="26" rx="4" fill="#f59e0b"/>
    <rect x="55" y="20" width="70" height="26" rx="4" fill="#10b981"/>
    <!-- Overhang slice -->
    <rect x="125" y="20" width="20" height="26" rx="2" fill="#f43f5e" opacity="0.6"/>
  </g>
  <rect x="20" y="20" width="90" height="24" rx="12" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1"/>
  <text x="65" y="36" fill="#38bdf8" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">ARCADE</text>
  <text x="200" y="220" fill="#ffffff" font-size="20" font-weight="900" font-family="sans-serif" text-anchor="middle" letter-spacing="2">TOWER STACK NEON</text>
</svg>
